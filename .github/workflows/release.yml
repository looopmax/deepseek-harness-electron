name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac
            os: macos-latest
            args: --mac
          - name: linux
            os: ubuntu-latest
            args: --linux
          # - name: win   # temporarily disabled for the 0.1.0 release
          #   os: windows-latest
          #   args: --win
            os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      # One pnpm workspace: apps/client + the absorbed deepseek-harness
      # submodule (see pnpm-workspace.yaml).
      # Uses the pnpm version pinned by "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (single pnpm workspace)
        run: pnpm install --frozen-lockfile

      - name: Build harness
        run: pnpm --filter @deepseek-ai/dsh-root run build

      # Keep electron-builder failures printable: without this, a child
      # process that floods stdout makes the builder die with an opaque
      # "RangeError: Invalid string length" instead of the real error.
      # The packaged harness's .pnpm store has peer-suffixed entry names that
      # push file paths past Windows' 260-char limit; 7-Zip (longPathAware)
      # honors the LongPathsEnabled registry flag once set for new processes.
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name LongPathsEnabled -Value 1 -Type DWord

      - name: Sanitize builder error logging
        run: node apps/client/build/sanitize-builder-log.mjs

      - name: Download Node.js runtime
        run: node apps/client/build/fetch-node.mjs

      # electron-builder reads its config from apps/client/package.json.
      - name: Build installer (macOS)
        if: runner.os == 'macOS'
        run: |
          # @electron/osx-sign walks the whole app bundle (~100k files) while
          # signing; the runner's default soft fd limit (256) is exhausted and
          # the build dies with EMFILE: too many open files.
          ulimit -n 65536 2>/dev/null || ulimit -n 10240 2>/dev/null || true
          cd apps/client
          # identity=null skips the ad-hoc signing walk of the huge bundle.
          npx electron-builder ${{ matrix.args }} --publish never --config.mac.identity=null
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # @electron/osx-sign walks the whole app bundle in node; the harness copy
          # makes it exceed the default ~2GB heap when signing on macOS.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build installer (Linux/Windows)
        if: runner.os != 'macOS'
        run: |
          cd apps/client
          npx electron-builder ${{ matrix.args }} --publish never --config.mac.identity=-
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
